# Publishes katzenpost-lean-sys to crates.io when a tag vX.Y.Z naming the version in Cargo.toml is
# pushed, with crates.io's trusted publishing: crates.io trusts this workflow of this repository,
# so no token is stored. Pull requests package the crate without publishing it.

name: publish

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      ELAN_VERSION: 4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          # Outside the checkout, which cargo publish wants clean.
          toolchain=$(cat lean-toolchain)
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --default-toolchain "$toolchain" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: the tag is the crate's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ours=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag $GITHUB_REF_NAME, Cargo.toml $ours"
          [ "$GITHUB_REF_NAME" = "$ours" ]
      - run: cargo publish --dry-run

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      ELAN_VERSION: 4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@v4
      # The first version of a crate is published by hand, so its tag finds it there already.
      - name: whether this version is on crates.io
        id: crate
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(echo "$meta" | jq -r '.packages[0].name')
          version=$(echo "$meta" | jq -r '.packages[0].version')
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY publish workflow" \
            "https://crates.io/api/v1/crates/$name/$version")
          echo "$name $version: HTTP $code"
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: install elan
        if: steps.crate.outputs.published == 'false'
        run: |
          # Outside the checkout, which cargo publish wants clean.
          toolchain=$(cat lean-toolchain)
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --default-toolchain "$toolchain" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crate.outputs.published == 'false'
        id: auth
      - run: cargo publish
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
