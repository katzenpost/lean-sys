[package]
name = "katzenpost-lean-sys"
version = "0.1.0"
authors = [
    "Jad Ghalayini <jeg74@cl.cam.ac.uk>",
    "Mario Carneiro <mcarneir@andrew.cmu.edu>",
    "Zhu Yifan <i@zhuyi.fan>"
]
edition = "2021"
description = "Bindings to Lean 4's C API, for Lean 4.35.0: Katzenpost's fork of lean-sys"
repository = "https://github.com/katzenpost/lean-sys"
license = "MIT OR Apache-2.0"
keywords = ["lean", "math", "bindings"]
categories = ["external-ffi-bindings"]
links = "leanshared"

# Used as `lean_sys`, as the crate it is a fork of.
[lib]
name = "lean_sys"

[features]
mimalloc = []
extern = []
static = []
default = ["mimalloc", "static"]

[dependencies]
libc = { version = "0.2", default-features = false }
memoffset = "0.9"
static_assertions = "1.1.0"
parking_lot = "0.12"

[dev-dependencies]
rand = "0.9"
rand_xoshiro = "0.7"
